services:
  local-image-gen-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: local-image-gen-mcp
    entrypoint: ["python", "server.py"]
    ports:
      - "8500:8500"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - image-outputs:/outputs
      # Compile caches survive container recreation (FR-006-11). Two separate
      # volumes (not subpaths of one: Docker fails to mount a subpath that does
      # not exist yet), and ~/.cache/huggingface above is not shadowed.
      - image-gen-cuda-cache:/root/.nv
      - image-gen-torch-cache:/root/.cache/torch
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: /root/.cache/huggingface
      IMAGE_MODEL: qwen_image_2_1
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8500"
      IMAGE_OUTPUT_DIR: /outputs
      TORCH_DTYPE: "bfloat16"
      IMAGE_GPU_MEMORY_LIMIT: "40"
      # Empty = server default (see EDIT_OUTPUT_RESOLUTION in .env.example)
      EDIT_OUTPUT_RESOLUTION: ${EDIT_OUTPUT_RESOLUTION:-}
      # Empty = server default (1024). Above MAX_OUTPUT_RESOLUTION the server refuses to start
      GENERATE_OUTPUT_RESOLUTION: ${GENERATE_OUTPUT_RESOLUTION:-}
      MAX_OUTPUT_RESOLUTION: ${MAX_OUTPUT_RESOLUTION:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    shm_size: '8gb'
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8500)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: no

volumes:
  image-outputs:
  image-gen-cuda-cache:
  image-gen-torch-cache: