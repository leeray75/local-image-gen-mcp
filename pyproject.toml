[project]
name = "local-image-gen-mcp"
version = "1.0.0"
description = "Model-agnostic MCP server for local text-to-image generation"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.27.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.7.0",
    "diffusers>=0.33.0",
    "torch>=2.7.0",
    "transformers>=4.52.0",
    "accelerate>=1.7.0",
    "safetensors>=0.5.3",
    "pillow>=11.2.1",
    "huggingface-hub>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]